name: Pygments

on: [push, pull_request]

env:
  PIP_INDEX_URL: "https://:2022-01-06T23:59:59.999999Z@time-machines-pypi.sealsecurity.io/"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.5", "3.6", "3.7", "3.8", "3.9", "3.10"]
        exclude:
          # ubuntu-latest has no prebuilt Python 3.7; use ubuntu-22.04 instead
          # (see include below) so setup-python doesn't compile it from source.
          - os: ubuntu-latest
            python-version: "3.7"
        include:
          - os: ubuntu-22.04
            python-version: "3.7"
      max-parallel: 4

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    # pytest's win32-only dependency atomicwrites was deleted from PyPI and has
    # no files in the time-machine mirror, so requirements.txt can't resolve it.
    # Pull it from upstream PyPI (test-only dep; not part of the built artifact).
    - name: Install atomicwrites from PyPI (Windows only)
      if: runner.os == 'Windows'
      run: pip install --index-url https://pypi.org/simple/ atomicwrites==1.4.0
    - name: Install package
      run: |
        python -m pip install --upgrade --force-reinstall pip setuptools
        pip install -r requirements.txt
        pip install .
    - name: Test package
      run: make test TEST=-v
      if: runner.os == 'Linux'
    - name: Test package
      run: python -m pytest

  # Build the distribution in its own job with a clean checkout. Building in
  # the matrix job above would package the __pycache__ directories created by
  # `pip install .` and the test runs into the wheel/sdist.
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: "3.10"
    - name: Build wheel and sdist
      run: |
        python -m pip install --upgrade --force-reinstall pip setuptools
        pip install --force-reinstall build
        python -m build
    - name: Upload built artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pygments-dist
        path: dist/*

  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
    - name: Run make check
      run: make check
    - name: Fail if the basic checks failed
      run: make check
      if: runner.os == 'Linux'

  check-mapfiles:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
    - name: Regenerate mapfiles
      run: make mapfiles
    - name: Fail if mapfiles changed
      run: |
        if git ls-files -m | grep mapping; then
          echo 'Please run "make mapfiles" and add the changes to a commit.'
          exit 1
        fi

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
      with:
        python-version: 3.8
    - name: Check out regexlint
      run: git clone https://github.com/pygments/regexlint
    - name: Run regexlint
      run: make regexlint REGEXLINT=`pwd`/regexlint
